# Configuration for DINOv2-DDRNet Knowledge Distillation
# Cityscapes Dataset

# Dataset settings
dataset:
  name: cityscapes
  root: ./data/cityscapes
  num_classes: 19
  ignore_index: 255
  train_split: train
  val_split: val
  
# Image preprocessing
image:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  base_size: 2048
  crop_size: [1024, 1024]  # [height, width]
  
# Model settings
model:
  # Teacher model (DINOv2)
  teacher:
    name: dinov2_vitb14  # Options: dinov2_vits14, dinov2_vitb14, dinov2_vitl14, dinov2_vitg14
    pretrained: true
    freeze_backbone: true
    
  # Student model (DDRNet)
  student:
    name: DDRNet23  # Options: DDRNet23, DDRNet23Slim, DDRNet39
    pretrained: false
    augment: true  # Use auxiliary head during training
    
  # Knowledge distillation settings
  kd:
    kd_weight: 1.0          # Weight for logit-based KD loss
    feature_weight: 0.5     # Weight for feature distillation
    structural_weight: 0.3  # Weight for structural distillation
    temperature: 4.0        # Temperature for KD
    task_loss_weight: 1.0   # Weight for task (segmentation) loss

# Training settings
train:
  batch_size: 8
  num_workers: 4
  epochs: 300
  start_epoch: 0
  
  # Optimizer
  optimizer:
    type: sgd  # Options: sgd, adam, adamw
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    
  # Learning rate scheduler
  scheduler:
    type: poly  # Options: poly, cosine, multistep
    power: 0.9  # For polynomial scheduler
    
  # Data augmentation
  augmentation:
    random_flip: true
    random_scale: [0.5, 2.0]
    color_jitter: true
    
# Validation settings
val:
  batch_size: 4
  num_workers: 4
  eval_interval: 10  # Evaluate every N epochs

# Checkpoint and logging
checkpoint:
  save_dir: ./checkpoints
  save_interval: 10  # Save checkpoint every N epochs
  keep_latest: 5     # Keep only latest N checkpoints
  
logging:
  log_dir: ./logs
  log_interval: 50  # Print log every N iterations
  use_tensorboard: true

# Miscellaneous
seed: 42
cudnn:
  benchmark: true
  deterministic: false
